name: Run NovaWallet Tests

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman & htmlextra
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman Collection
        run: |
          newman run "./NovaWallet Transfer API.postman_collection.json" -r cli,htmlextra --reporter-htmlextra-export report.html

      - name: Upload HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaWallet-HTML-Dashboard
          path: report.html
